<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Planner</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --text: #1d1d1f; --muted: #6b6b70;
    --border: #e2e0db; --accent: #0b6e4f; --danger: #b3261e; --warn-bg: #fff4e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617; --card: #222224; --text: #f2f2f2; --muted: #a0a0a6;
      --border: #3a3a3d; --accent: #4fc79a; --danger: #ff8a80; --warn-bg: #3a2a12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 16px; }
  h2 { font-size: 1.1rem; margin: 0; }
  a { color: var(--accent); }
  input, textarea, select { font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 60px; resize: vertical; }
  button { font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .4; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .stop { display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; align-items: center; margin: 8px 0; }
  .stop .actions { display: flex; gap: 4px; }
  .stop .actions button { padding: 6px 8px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .title-input { font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
  .links { display: grid; gap: 4px; margin-bottom: 16px; }
  .links code { word-break: break-all; }
  .banner { background: var(--warn-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px;
    margin-bottom: 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .status { position: fixed; right: 16px; bottom: 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px; font-size: .85rem; color: var(--muted); }
  .view-stop { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .view-stop .time { width: 56px; color: var(--muted); flex: none; }
  .notes { white-space: pre-wrap; margin-top: 8px; }
  ul.recent { padding: 0; list-style: none; }
  ul.recent li { padding: 6px 0; justify-content: space-between; }
  button.small { padding: 2px 10px; font-size: .85rem; }
  ul.recent select { width: auto; }
  .auth { display: grid; gap: 10px; }
  .error { color: var(--danger); margin: 0; min-height: 1.5em; }
  .recovery { font-size: 1.2rem; letter-spacing: .05em; padding: 12px; background: var(--bg);
    border: 1px dashed var(--border); border-radius: 8px; text-align: center; word-break: break-all; }
  summary { cursor: pointer; font-weight: 600; }
  dialog.picker { width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0;
    border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); }
  dialog.picker::backdrop { background: rgba(0, 0, 0, .5); }
  .picker-map { height: min(60vh, 520px); }
  .picker-map-wrap { position: relative; }
  .picker-search { position: absolute; top: 10px; left: 10px; width: min(360px, calc(100% - 60px)); z-index: 2; }
  .picker-search input { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .search-results { list-style: none; margin: 4px 0 0; padding: 4px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.3); max-height: 280px; overflow-y: auto; }
  .search-results button { display: grid; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 6px 8px; }
  .search-results button:hover, .search-results button:focus { background: var(--bg); }
  .search-results .empty { padding: 6px 8px; }
  .picker-form { display: grid; gap: 8px; padding: 12px 16px 16px; }
  .picker-form .row button { flex: none; }
  .pin { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; border: 2px solid #fff;
    display: grid; place-items: center; font: 600 12px/1 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin.new { background: var(--danger); font-size: 16px; }
  @media (max-width: 480px) {
    .stop { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");

// ---------- small DOM helper (sets text/values, never innerHTML, so user input is safe) ----------
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (k in node) node[k] = v;
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) node.append(c);
  return node;
}

// Map-picked stops link to their exact coordinates; typed-in stops search by name.
const mapsLink = (stop) =>
  "https://www.google.com/maps/search/?api=1&query=" +
  encodeURIComponent(stop.lat !== undefined ? `${stop.lat},${stop.lng}` : stop.location);

const tripUrl = (id) => "/t/" + id;

// Returns true if the trip was deleted.
async function deleteTrip(id, title) {
  if (!confirm(`Delete "${title || "Untitled trip"}"? This can't be undone, and everyone it's shared with loses access.`)) return false;
  const res = await fetch("/api/trips/" + id, { method: "DELETE" });
  if (!res.ok) { alert((await res.json()).error); return false; }
  return true;
}

// Where to go after logging in: back to the trip that sent you to the login page, if any.
function nextTrip() {
  const next = new URLSearchParams(location.search).get("next");
  return next && /^\/[te]\/[0-9a-f]{32}$/.test(next) ? next : null;
}

// ---------- home ----------
const postJson = (url, body) =>
  fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

async function renderHome() {
  document.title = "Travel Planner";
  const { username } = await (await fetch("/api/me")).json();
  if (username && nextTrip()) location.href = nextTrip();
  else if (username) renderDashboard(username);
  else renderLogin();
}

function renderLogin() {
  const username = el("input", { placeholder: "Username", autocomplete: "username", required: true });
  const password = el("input", { type: "password", placeholder: "Password (8+ characters)",
    autocomplete: "current-password", required: true });
  const error = el("p", { className: "error" });
  const submit = async (e) => {
    e.preventDefault();
    const signingUp = e.submitter && e.submitter.value === "signup";
    const res = await postJson(signingUp ? "/api/signup" : "/api/login",
      { username: username.value, password: password.value });
    const body = await res.json();
    if (!res.ok) error.textContent = body.error;
    else if (body.recoveryCode) showRecoveryCode(body.recoveryCode);
    else renderHome();
  };
  app.replaceChildren(
    el("h1", {}, "Travel Planner"),
    el("form", { className: "card auth", onsubmit: submit },
      el("p", { className: "muted" }, nextTrip()
        ? "Log in to open this trip. Only its owner and people they've invited can see it."
        : "Log in, or pick a username and password to create an account."),
      username, password, error,
      el("div", { className: "row" },
        el("button", { className: "primary", type: "submit", value: "login" }, "Log in"),
        el("button", { type: "submit", value: "signup" }, "Create account")),
      el("a", { href: "#", onclick: (e) => { e.preventDefault(); renderReset(); } }, "Forgot password?"))
  );
}

function renderReset() {
  const username = el("input", { placeholder: "Username", autocomplete: "username", required: true });
  const code = el("input", { placeholder: "Recovery code", autocomplete: "off", required: true });
  const password = el("input", { type: "password", placeholder: "New password (8+ characters)",
    autocomplete: "new-password", required: true });
  const error = el("p", { className: "error" });
  const submit = async (e) => {
    e.preventDefault();
    const res = await postJson("/api/reset-password",
      { username: username.value, code: code.value, password: password.value });
    const body = await res.json();
    if (res.ok) showRecoveryCode(body.recoveryCode, "Password changed, and you're logged in. Your old recovery code no longer works.");
    else error.textContent = body.error;
  };
  app.replaceChildren(
    el("h1", {}, "Reset password"),
    el("form", { className: "card auth", onsubmit: submit },
      el("p", { className: "muted" }, "Enter the recovery code you saved when you created your account."),
      username, code, password, error,
      el("div", { className: "row" },
        el("button", { className: "primary", type: "submit" }, "Reset password"),
        el("button", { type: "button", onclick: renderLogin }, "Back"))));
}

function showRecoveryCode(code, intro = "Your account is ready.") {
  app.replaceChildren(
    el("h1", {}, "Save your recovery code"),
    el("div", { className: "card auth" },
      el("p", {}, intro + " If you forget your password, this code is the only way back in. " +
        "Store it somewhere safe, like a password manager. It won't be shown again."),
      el("code", { className: "recovery" }, code),
      el("div", { className: "row" },
        el("button", { onclick: (e) => navigator.clipboard.writeText(code).then(() => { e.target.textContent = "Copied"; }) }, "Copy"),
        el("button", { className: "primary", onclick: renderHome }, "I've saved it"))));
}

async function renderDashboard(username) {
  const trips = await (await fetch("/api/my-trips")).json();
  const owned = trips.filter((t) => t.role === "owner");
  const shared = trips.filter((t) => t.role !== "owner");
  const title = el("input", { placeholder: "Trip name, e.g. Tokyo in spring", maxLength: 200 });
  const create = async (e) => {
    e.preventDefault();
    const res = await postJson("/api/trips", { title: title.value.trim() });
    if (res.status === 401) return renderHome();
    const { id } = await res.json();
    location.href = tripUrl(id);
  };
  const logout = async () => { await postJson("/api/logout", {}); renderHome(); };
  app.replaceChildren(
    el("div", { className: "row", style: "justify-content: space-between" },
      el("h1", {}, "Travel Planner"),
      el("span", { className: "muted" }, username + " · ", el("button", { onclick: logout }, "Log out"))),
    el("form", { className: "card row", onsubmit: create },
      title, el("button", { className: "primary", type: "submit" }, "New itinerary")),
    el("h2", {}, "My trips"),
    owned.length
      ? el("ul", { className: "recent" }, owned.map((t) =>
          el("li", { className: "row" },
            el("a", { href: tripUrl(t.id) }, t.title || "Untitled trip"),
            el("button", { className: "danger small", onclick: async () => {
              if (await deleteTrip(t.id, t.title)) renderHome();
            } }, "Delete"))))
      : el("p", { className: "muted" }, "No trips yet. Create one above."),
    shared.length ? el("h2", {}, "Shared with me") : "",
    shared.length
      ? el("ul", { className: "recent" }, shared.map((t) =>
          el("li", { className: "row" },
            el("a", { href: tripUrl(t.id) }, t.title || "Untitled trip"),
            el("span", { className: "muted" }, t.owner + " · " + (t.role === "editor" ? "can edit" : "view only")))))
      : "",
    accountSettings()
  );
}

function accountSettings() {
  const password = el("input", { type: "password", placeholder: "Current password",
    autocomplete: "current-password", required: true });
  const error = el("p", { className: "error" });
  const submit = async (e) => {
    e.preventDefault();
    const res = await postJson("/api/recovery-code", { password: password.value });
    const body = await res.json();
    if (res.ok) showRecoveryCode(body.recoveryCode, "Your old recovery code no longer works.");
    else error.textContent = body.error;
  };
  return el("details", { className: "card" },
    el("summary", {}, "Account"),
    el("form", { className: "auth", style: "margin-top: 12px", onsubmit: submit },
      el("p", { className: "muted", style: "margin: 0" }, "Lost your recovery code? Confirm your password to get a new one."),
      password, error,
      el("div", {}, el("button", { type: "submit" }, "New recovery code"))));
}

// ---------- trip ----------
let trip;          // { data, version, role, canEdit, owner, you, members }
let token;         // the trip's id
let saveTimer, saving = false, pendingSave = false, conflict = false, deleted = false;
const status = el("div", { className: "status", hidden: true });

function setStatus(text) { status.textContent = text; status.hidden = !text; }

function scheduleSave() {
  if (conflict) return;
  setStatus("Unsaved…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 1000);
}

async function save() {
  if (saving) { pendingSave = true; return; }
  saving = true;
  setStatus("Saving…");
  try {
    const res = await fetch("/api/trips/" + token, {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ data: trip.data, version: trip.version }),
    });
    if (res.status === 409) { conflict = true; pendingSave = false; renderTrip(); return; }
    // 404: deleted, or the owner removed you. 403: the owner made you a viewer.
    if (res.status === 404 || res.status === 403) {
      conflict = deleted = true; pendingSave = false; setStatus(""); renderTrip(); return;
    }
    if (!res.ok) throw new Error((await res.json()).error);
    trip.version = (await res.json()).version;
    setStatus("Saved");
  } catch (err) {
    setStatus("Save failed — " + err.message);
  } finally {
    saving = false;
    if (pendingSave) { pendingSave = false; save(); }
  }
}

// Old /e/ links can claim a trip made before accounts existed; otherwise this is a no-op.
async function claimTrip(t) {
  const res = await fetch(`/api/trips/${t}/claim`, { method: "POST" });
  if (res.status === 401) { location.href = "/?next=" + encodeURIComponent("/e/" + t); return; }
  history.replaceState(null, "", tripUrl(t));
  loadTrip(t);
}

async function loadTrip(t) {
  token = t;
  const res = await fetch("/api/trips/" + t);
  if (res.status === 401) {
    location.href = "/?next=" + encodeURIComponent(tripUrl(t));
    return;
  }
  if (!res.ok) {
    app.replaceChildren(el("h1", {}, "Trip not found"),
      el("p", { className: "muted" }, "It may have been deleted, or its owner hasn't shared it with you."),
      el("a", { href: "/" }, "Back home"));
    return;
  }
  trip = await res.json();
  renderTrip();
}

// Structural edits (add/remove/move) re-render; typing only updates state, so focus is kept.
function change(mutator) { mutator(trip.data); renderTrip(); scheduleSave(); }

function renderTrip() {
  const { data, canEdit } = trip;
  document.title = data.title || "Untitled trip";
  const locked = conflict;

  const header = canEdit
    ? [
        el("p", {}, el("a", { href: "/" }, "← All trips")),
        el("input", {
          className: "title-input", value: data.title, maxLength: 200, disabled: locked, placeholder: "Trip name",
          oninput: (e) => { data.title = e.target.value; document.title = data.title; scheduleSave(); },
        }),
        sharedByLine(),
      ]
    : [el("p", {}, el("a", { href: "/" }, "← All trips")), el("h1", {}, data.title || "Untitled trip"),
       sharedByLine()];

  const banner = deleted
    ? el("div", { className: "banner" },
        el("span", {}, "This trip was deleted, or the owner changed your access. Your last edit was not saved."),
        el("a", { href: "/" }, "Back home"))
    : conflict && el("div", { className: "banner" },
        el("span", {}, "Someone else changed this trip. Reload to see their changes (your last edit was not saved)."),
        el("button", { className: "primary", onclick: () => location.reload() }, "Reload"));

  const days = data.days.map((day, di) => canEdit ? editDay(day, di, locked) : viewDay(day, di));

  app.replaceChildren(
    ...header,
    banner || "",
    ...days,
    canEdit ? el("button", { disabled: locked, onclick: () => change((d) => d.days.push({ notes: "", stops: [] })) }, "+ Add day") : "",
    trip.role === "owner" ? sharingCard() : "",
    trip.role === "owner" ? el("p", { style: "margin-top: 32px" },
      el("button", { className: "danger", onclick: async () => {
        clearTimeout(saveTimer);
        if (await deleteTrip(token, data.title)) location.href = "/";
        else if (status.textContent === "Unsaved…") save();
      } }, "Delete trip")) : ""
  );
  app.append(status);
  if (!canEdit) setStatus("");
}

// For invited members: whose trip this is, what they can do, and a way to leave.
function sharedByLine() {
  if (trip.role === "owner") return "";
  const leave = async () => {
    if (!confirm("Leave this trip? You'll need the owner to invite you again.")) return;
    const res = await fetch(`/api/trips/${token}/members/${trip.you}`, { method: "DELETE" });
    if (res.ok) location.href = "/";
    else alert((await res.json()).error);
  };
  return el("p", { className: "muted row" },
    `Shared by ${trip.owner} · ${trip.canEdit ? "You can edit" : "View only"}`,
    el("button", { className: "small", onclick: leave }, "Leave trip"));
}

function sharingCard() {
  const membersUrl = `/api/trips/${token}/members`;
  const roleSelect = (value) => el("select", { value },
    el("option", { value: "editor", selected: value === "editor" }, "Can edit"),
    el("option", { value: "viewer", selected: value === "viewer" }, "View only"));
  const setMember = async (username, role) => {
    const res = await postJson(membersUrl, { username, role });
    const body = await res.json();
    if (!res.ok) return body.error;
    trip.members = trip.members.filter((m) => m.username !== body.username).concat(body)
      .sort((a, b) => a.username.localeCompare(b.username));
    renderTrip();
  };
  const remove = async (username) => {
    const res = await fetch(`${membersUrl}/${username}`, { method: "DELETE" });
    if (!res.ok) return alert((await res.json()).error);
    trip.members = trip.members.filter((m) => m.username !== username);
    renderTrip();
  };

  const username = el("input", { placeholder: "Username", autocomplete: "off", required: true });
  const role = roleSelect("editor");
  const error = el("p", { className: "error" });
  const invite = async (e) => {
    e.preventDefault();
    error.textContent = (await setMember(username.value, role.value)) || "";
  };

  return el("section", { className: "card" },
    el("h2", {}, "Sharing"),
    el("p", { className: "muted" }, "Only you and the people below can open this trip, and everyone has to log in."),
    trip.members.length
      ? el("ul", { className: "recent" }, trip.members.map((m) =>
          el("li", { className: "row" },
            el("span", { style: "flex: 1" }, m.username),
            Object.assign(roleSelect(m.role), {
              onchange: async (e) => { const err = await setMember(m.username, e.target.value); if (err) alert(err); },
            }),
            el("button", { className: "danger small", onclick: () => remove(m.username) }, "Remove"))))
      : el("p", { className: "muted" }, "Not shared with anyone yet."),
    el("form", { className: "row", onsubmit: invite },
      username, role, el("button", { className: "primary", type: "submit" }, "Invite")),
    error);
}

function editDay(day, di, locked) {
  const stops = day.stops.map((stop, si) =>
    el("div", { className: "stop" },
      el("input", { type: "time", value: stop.time, disabled: locked,
        oninput: (e) => { stop.time = e.target.value; scheduleSave(); } }),
      el("input", { value: stop.location, placeholder: "Place", disabled: locked,
        oninput: (e) => { stop.location = e.target.value; scheduleSave(); } }),
      el("div", { className: "actions" },
        el("button", { title: "Move up", disabled: locked || si === 0,
          onclick: () => change(() => day.stops.splice(si - 1, 0, ...day.stops.splice(si, 1))) }, "↑"),
        el("button", { title: "Move down", disabled: locked || si === day.stops.length - 1,
          onclick: () => change(() => day.stops.splice(si + 1, 0, ...day.stops.splice(si, 1))) }, "↓"),
        el("button", { title: "Open in Google Maps",
          onclick: () => (stop.location || stop.lat !== undefined) && window.open(mapsLink(stop), "_blank", "noopener") }, "Map"),
        el("button", { className: "danger", title: "Remove stop", disabled: locked,
          onclick: () => change(() => day.stops.splice(si, 1)) }, "✕"))));

  return el("section", { className: "card" },
    el("div", { className: "row", style: "justify-content: space-between" },
      el("h2", {}, "Day " + (di + 1)),
      el("button", { className: "danger", disabled: locked || trip.data.days.length === 1,
        onclick: () => confirm("Delete Day " + (di + 1) + "?") && change((d) => d.days.splice(di, 1)) }, "Delete day")),
    stops,
    el("div", { className: "row" },
      el("button", { disabled: locked, onclick: () => change(() => day.stops.push({ time: "", location: "" })) }, "+ Add stop"),
      el("button", { disabled: locked, onclick: (e) => {
        e.target.textContent = "Loading map…";
        openMapPicker(day, di)
          .catch(() => alert("Couldn't load the map. Check your connection and try again."))
          .finally(() => { e.target.textContent = "+ Pick on map"; });
      } }, "+ Pick on map")),
    el("p", { className: "muted", style: "margin: 12px 0 4px" }, "Notes for this day"),
    el("textarea", { value: day.notes, disabled: locked, placeholder: "Bookings, reminders, ideas…",
      oninput: (e) => { day.notes = e.target.value; scheduleSave(); } }));
}

function viewDay(day, di) {
  return el("section", { className: "card" },
    el("h2", {}, "Day " + (di + 1)),
    day.stops.length
      ? day.stops.map((s) => el("div", { className: "view-stop" },
          el("span", { className: "time" }, s.time || "—"),
          s.location ? el("a", { href: mapsLink(s), target: "_blank", rel: "noopener" }, s.location)
                     : el("span", { className: "muted" }, "(no place)")))
      : el("p", { className: "muted" }, "No stops yet."),
    day.notes && el("div", { className: "notes" }, day.notes));
}

// ---------- map picker ----------
const MAPLIBRE_URL = "https://unpkg.com/maplibre-gl@6.12.0/dist/";
const MAP_STYLE = "https://tiles.openfreemap.org/styles/liberty";
let maplibre;  // loaded on first use so the home page stays light
let picker;    // { dialog, map, title, name, add, hint, marker, stopMarkers, day, dayIndex, point, nameEdited, lookup }

async function loadMapLibre() {
  if (!maplibre) {
    document.head.append(el("link", { rel: "stylesheet", href: MAPLIBRE_URL + "maplibre-gl.css" }));
    maplibre = await import(MAPLIBRE_URL + "maplibre-gl.mjs");
  }
  return maplibre;
}

const round6 = (n) => Math.round(n * 1e6) / 1e6;
const coordsLabel = (p) => `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;

function pinElement(label, extraClass = "") {
  return el("div", { className: "pin " + extraClass }, label);
}

// Reverse geocode with OpenStreetMap's Nominatim (fine for light, user-driven use; max 1 request/second).
async function placeName({ lat, lng }) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${lat}&lon=${lng}` +
    `&accept-language=${encodeURIComponent(navigator.language || "en")}`;
  const place = await (await fetch(url)).json();
  if (place.name) return place.name;
  return place.display_name ? place.display_name.split(", ").slice(0, 2).join(", ") : null;
}

// Search-as-you-type with Photon (OpenStreetMap data, built for autocomplete), biased towards the map view.
async function searchPlaces(query, near, signal) {
  const lang = (navigator.language || "en").slice(0, 2);
  const url = `https://photon.komoot.io/api/?limit=6&q=${encodeURIComponent(query)}` +
    `&lat=${near.lat}&lon=${near.lng}` + (["en", "de", "fr"].includes(lang) ? `&lang=${lang}` : "");
  const { features } = await (await fetch(url, { signal })).json();
  return features.map((f) => {
    const p = f.properties;
    const street = [p.street, p.housenumber].filter(Boolean).join(" ");
    return {
      name: p.name || street || p.city || "Unnamed place",
      detail: [...new Set([p.name && street, p.city || p.county, p.state, p.country].filter(Boolean))].join(", "),
      lng: f.geometry.coordinates[0],
      lat: f.geometry.coordinates[1],
      extent: p.extent, // [west, north, east, south] for areas like cities and parks
    };
  });
}

function buildPicker(ml) {
  const title = el("h2", {});
  const name = el("input", { placeholder: "Click the map to choose a place", disabled: true,
    oninput: () => { picker.nameEdited = true; } });
  const add = el("button", { className: "primary", type: "submit", disabled: true });
  const hint = el("p", { className: "muted", style: "margin: 0" }, "Search for a place, or click anywhere on the map to drop a pin.");
  const mapEl = el("div", { className: "picker-map" });
  const results = el("ul", { className: "search-results", hidden: true });
  const search = el("input", { type: "search", placeholder: "Search for a place…", autocomplete: "off",
    oninput: () => onSearchInput(),
    onkeydown: (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      results.querySelector("button")?.click();
    } });
  const dialog = el("dialog", { className: "picker" },
    el("div", { className: "row", style: "justify-content: space-between; padding: 12px 16px" },
      title, el("button", { onclick: () => dialog.close() }, "Done")),
    el("div", { className: "picker-map-wrap" }, mapEl, el("div", { className: "picker-search" }, search, results)),
    el("form", { className: "picker-form", onsubmit: (e) => { e.preventDefault(); addPickedStop(); } },
      el("div", { className: "row" }, name, add), hint));
  document.body.append(dialog);

  // 2D only: no tilting or rotating.
  const map = new ml.Map({ container: mapEl, style: MAP_STYLE, center: [0, 20], zoom: 1.5,
    maxPitch: 0, dragRotate: false, pitchWithRotate: false, touchPitch: false });
  map.touchZoomRotate.disableRotation();
  map.keyboard.disableRotation();
  map.addControl(new ml.NavigationControl({ showCompass: false }));
  map.addControl(new ml.GeolocateControl({ positionOptions: { enableHighAccuracy: true } }));
  map.on("click", (e) => { showResults(null); pickPoint(e.lngLat); });

  return { dialog, map, title, name, add, hint, search, results, marker: null, stopMarkers: [], lookup: 0,
    searchTimer: null, searchAbort: null };
}

function onSearchInput() {
  clearTimeout(picker.searchTimer);
  picker.searchAbort?.abort();
  const query = picker.search.value.trim();
  if (query.length < 3) return showResults(null);
  picker.searchTimer = setTimeout(() => runSearch(query), 350);
}

async function runSearch(query) {
  const ctrl = new AbortController();
  picker.searchAbort = ctrl;
  try {
    showResults(await searchPlaces(query, picker.map.getCenter(), ctrl.signal));
  } catch (err) {
    if (err.name !== "AbortError") showResults([], "Search isn't available right now. Click the map instead.");
  }
}

function showResults(places, emptyText = "No places found.") {
  const { results } = picker;
  results.hidden = !places;
  if (!places) return results.replaceChildren();
  results.replaceChildren(...(places.length
    ? places.map((place) => el("li", {},
        el("button", { type: "button", onclick: () => chooseResult(place) },
          el("strong", {}, place.name), place.detail ? el("span", { className: "muted" }, place.detail) : "")))
    : [el("li", { className: "muted empty" }, emptyText)]));
}

function chooseResult(place) {
  showResults(null);
  picker.search.value = place.name;
  if (place.extent) {
    const [west, north, east, south] = place.extent;
    picker.map.fitBounds([[west, south], [east, north]], { padding: 40, maxZoom: 17 });
  } else {
    picker.map.flyTo({ center: [place.lng, place.lat], zoom: 16 });
  }
  pickPoint({ lng: place.lng, lat: place.lat }, place.name);
}

async function openMapPicker(day, dayIndex) {
  const ml = await loadMapLibre();
  if (!picker) picker = buildPicker(ml);
  Object.assign(picker, { day, dayIndex, point: null, nameEdited: false });
  picker.title.textContent = "Add a stop to Day " + (dayIndex + 1);
  picker.add.textContent = "Add to Day " + (dayIndex + 1);
  resetPick();
  drawDayStops(ml);
  picker.search.value = "";
  showResults(null);

  picker.dialog.showModal();
  picker.search.focus();
  picker.map.resize();
  // Frame this day's mapped stops, else any mapped stop in the trip, else keep the current view.
  const pts = day.stops.filter((s) => s.lat !== undefined);
  const framing = pts.length ? pts : trip.data.days.flatMap((d) => d.stops).filter((s) => s.lat !== undefined);
  if (framing.length) {
    const bounds = new ml.LngLatBounds();
    framing.forEach((s) => bounds.extend([s.lng, s.lat]));
    picker.map.fitBounds(bounds, { padding: 60, maxZoom: 15, duration: 0 });
  }
}

function drawDayStops(ml) {
  picker.stopMarkers.forEach((m) => m.remove());
  picker.stopMarkers = picker.day.stops
    .map((s, i) => s.lat === undefined ? null :
      new ml.Marker({ element: pinElement(String(i + 1)) }).setLngLat([s.lng, s.lat]).addTo(picker.map))
    .filter(Boolean);
}

function resetPick() {
  picker.marker?.remove();
  picker.marker = null;
  picker.point = null;
  picker.nameEdited = false;
  picker.name.value = "";
  picker.name.disabled = true;
  picker.add.disabled = true;
}

// `knownName` comes from a search result; map clicks look the name up instead.
async function pickPoint(lngLat, knownName) {
  const point = { lat: round6(lngLat.lat), lng: round6(lngLat.lng) };
  picker.point = point;
  // A marker must have a position before addTo(), or MapLibre throws while drawing it.
  if (!picker.marker) picker.marker = new maplibre.Marker({ element: pinElement("+", "new") });
  picker.marker.setLngLat([point.lng, point.lat]).addTo(picker.map);
  picker.name.disabled = false;
  picker.add.disabled = false;
  const lookup = ++picker.lookup; // ignore answers to older clicks
  if (knownName) {
    picker.nameEdited = false;
    picker.name.value = knownName;
    picker.hint.textContent = "Edit the name if you like, then add it.";
    return;
  }
  if (!picker.nameEdited) picker.name.value = coordsLabel(point);
  picker.hint.textContent = "Looking up the place name…";

  const name = await placeName(point).catch(() => null);
  if (lookup !== picker.lookup) return;
  if (name && !picker.nameEdited) picker.name.value = name;
  picker.hint.textContent = name ? "Edit the name if you like, then add it." : "Couldn't find a name here — type one, or keep the coordinates.";
}

function addPickedStop() {
  if (!picker.point || conflict) return picker.dialog.close();
  const stop = { time: "", location: picker.name.value.trim() || coordsLabel(picker.point), ...picker.point };
  change(() => picker.day.stops.push(stop));
  resetPick();
  drawDayStops(maplibre);
  picker.hint.textContent = `Added "${stop.location}". Click the map to add another, or press Done.`;
}

// ---------- router ----------
const [, mode, t] = location.pathname.split("/");
if (mode === "e" && t) {
  claimTrip(t);
} else if (mode === "t" && t) {
  loadTrip(t);
} else if (mode === "v" && t) {
  app.replaceChildren(el("h1", {}, "View links no longer work"),
    el("p", { className: "muted" }, "Trips are now private. Ask the trip's owner to invite your username."),
    el("a", { href: "/" }, "Go to Travel Planner"));
} else {
  renderHome();
}
</script>
</body>
</html>
